<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picturall Calculator</title>
    
    <style>
        :root {
            --primary: #2563eb;       
            --primary-light: #eff6ff; 
            --primary-border: #bfdbfe;
            --bg-body: #f5f6f8;       
            --bg-card: #ffffff;       
            --bg-panel: #f8fafc;
            --text-main: #333;     
            --text-sub: #666;      
            --border-color: #ddd;  
            --radius-md: 7px; 
            --radius-sm: 5px; 
            --preview-blue: rgba(97, 142, 250, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 36px 18px; 
        }

        .container {
            width: 880px; /* 좌측 패널을 위해 너비 증가 */
            max-width: 100%;
            background: var(--bg-card);
            padding: 24px; 
            border-radius: 11px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            display: flex; /* 좌우 분할을 위한 Flexbox */
            gap: 24px;
        }

        /* --- [좌측 포토샵 스타일 레이어 패널] --- */
        .layer-panel {
            width: 180px;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }
        .layer-panel-header {
            background: #e2e8f0;
            padding: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
            color: #334155;
            border-bottom: 1px solid var(--border-color);
        }
        .layer-list {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
            height: 520px; /* 스크롤 고정 높이 */
        }
        .layer-item {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            margin-bottom: 2px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            color: #475569;
            transition: 0.1s;
        }
        .layer-item:hover { background: #e2e8f0; }
        .layer-item.active { background: var(--primary); color: white; font-weight: 600; }
        .layer-number { width: 24px; font-size: 0.7rem; opacity: 0.7; }
        .layer-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none;}
        .layer-hint { font-size: 0.6rem; color: #94a3b8; text-align: center; padding: 5px; border-top: 1px dashed var(--border-color); }

        /* --- [우측 컨트롤 영역] --- */
        .controls-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        h2 { text-align: center; font-weight: 800; color: var(--primary); font-size: 1.4rem; margin-bottom: 24px; margin-top: 5px;} 
        
        .inner-title { font-size: 0.85rem; font-weight: 700; color: #444; margin-bottom: 11px; } 
        label { font-size: 0.76rem; font-weight: 600; color: var(--text-sub); margin-bottom: 5px; display: block; padding-left: 2px;} 
        
        .form-row { display: flex; gap: 13px; margin-bottom: 13px; } 
        .form-group { flex: 1; }

        input, select {
            width: 100%; height: 39px; padding: 0 11px; border-radius: var(--radius-sm);
            border: 1px solid var(--border-color); background-color: white;
            color: var(--primary); font-weight: 500; font-size: 0.94rem; text-align: center; box-sizing: border-box;
            transition: all 0.2s; font-family: inherit;
        } 
        select { text-align: left; }

        input:focus, select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-light); }
        input:disabled { background-color: #f8f9fa; color: #888; border-color: #eee; }

        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        .visualizer-wrapper {
            width: 100%; background-color: #f1f5f9; border: 2px dashed #cbd5e1;
            position: relative; overflow: hidden; border-radius: var(--radius-sm); margin-bottom: 24px;
        } 
        .visualizer-source {
            position: absolute; background-color: var(--preview-blue);
            display: flex; justify-content: center; align-items: center; cursor: move;
        }
        .visualizer-source span { color: white; font-weight: 600; font-size: 0.8rem; pointer-events: none; } 

        .bottom-grid { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 30px; align-items: start; }
        .col-left, .col-right { display: flex; flex-direction: column; gap: 20px; }
        .dashed-divider { border: none; border-top: 1px dashed #cbd5e1; margin: -5px 0; width: 100%; }

        .ratio-info { font-size: 0.76rem; color: var(--text-sub); display: flex; align-items: center; gap: 6px; margin-top: 6px; padding-left: 2px; margin-bottom: 15px; } 
        .ratio-info .value { font-weight: 500; font-size: 0.94rem; color: var(--text-sub); } 

        .preset-btn-row { display: flex; gap: 7px; flex-wrap: wrap; } 
        .preset-btn { background-color: white; border: 1px solid var(--border-color); color: var(--text-sub); padding: 5px 9px; border-radius: 4px; font-size: 0.72rem; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; } 
        .preset-btn:hover { border-color: var(--primary); color: var(--primary); background-color: var(--primary-light); }

        .snap-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; } 
        .snap-btn { height: 39px; border: 1px solid var(--border-color); background: white; border-radius: var(--radius-sm); cursor: pointer; font-size: 1rem; transition: 0.2s; display: flex; justify-content: center; align-items: center; color: #555; } 
        .snap-btn:hover { background: var(--primary-light); border-color: var(--preview-blue); color: var(--preview-blue); }
        .snap-btn.active { background: var(--preview-blue); color: white; border-color: var(--preview-blue); }
        .snap-btn.active .dot { width: 5px; height: 5px; background: white; border-radius: 50%; } 

        .scale-list { background: #f8fafc; border: 1px solid var(--border-color); border-radius: var(--radius-sm); display: flex; flex-direction: column; justify-content: center; padding: 5px 0; }
        .scale-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 16px; border-bottom: 1px dashed var(--border-color); cursor: pointer; } 
        .scale-item:last-child { border-bottom: none; }
        .scale-item:hover { background: var(--primary-light); }
        .scale-label { font-size: 0.76rem; font-weight: 600; color: var(--text-sub); } 
        .scale-item .val { font-size: 0.94rem; font-weight: 500; color: #111; font-family: inherit; } 

        .control-box-blue { background-color: var(--primary-light); border: 1px solid var(--primary-border); padding: 21px; border-radius: var(--radius-md); display: flex; flex-direction: column; gap: 16px; } 
        .control-box-blue .form-row { margin-bottom: 0; gap: 13px;} 
        
        .readonly-box { width: 100%; height: 39px; padding: 0 11px; border-radius: var(--radius-sm); border: 1px solid var(--primary-border); background-color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; } 
        .readonly-box span { font-size: 0.94rem; font-weight: 500; color: #111; font-family: inherit; } 
        
        .stepper-wrapper { display: flex; align-items: center; background-color: #f8fafc; border: 1px solid transparent; border-radius: var(--radius-sm); height: 39px; overflow: hidden; transition: all 0.2s; }
        .stepper-wrapper button { background: transparent; border: none; color: #94a3b8; font-size: 1.1rem; width: 32px; height: 100%; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.2s; }
        .stepper-wrapper input { flex: 1; border: none !important; background: transparent !important; padding: 0; color: #94a3b8; font-weight: 500; text-align: center; }
        
        .copied { color: #10b981 !important; font-size: 0.94rem !important; }
        .helper-text { text-align: right; font-size: 0.72rem; color: #64748b; font-weight: 600; margin-top: -5px; } 

        .subdued-section { padding-top: 9px; border-top: 1px dashed #e2e8f0; }
        .subdued-section .inner-title { color: #94a3b8; font-size: 0.8rem; margin-bottom: 9px; } 
        .subdued-section label { color: #94a3b8; font-weight: 500; }
        .subdued-section select, .subdued-section input { height: 34px; font-size: 0.94rem; color: #64748b; font-weight: 500; background-color: transparent; border: 1px solid #e2e8f0; } 
    </style>
</head>
<body>

<div class="container">
    
    <div class="layer-panel">
        <div class="layer-panel-header">Layers</div>
        <div class="layer-list" id="layerList">
            </div>
        <div class="layer-hint">💡 더블클릭하여 이름 변경</div>
    </div>

    <div class="controls-area">
        <h2>Picturall Calculator</h2>

        <div>
            <div class="inner-title">Preview <span id="previewLayerName" style="color:var(--primary); font-weight:800; margin-left:10px;">[Layer 1]</span></div>
            <div class="visualizer-wrapper" id="visualizer">
                <div class="visualizer-source" id="sourceBox">
                    <span id="sourceResLabel">3840 X 2160</span>
                </div>
            </div>
        </div>

        <div class="bottom-grid">
            <div class="col-left">
                <div>
                    <div class="inner-title">영상 소스 해상도</div>
                    <div class="form-row" style="margin-bottom: 6px;">
                        <div class="form-group"><label>가로 (px)</label><input id="iw" type="number" value="3840"></div>
                        <div class="form-group"><label>세로 (px)</label><input id="ih" type="number" value="2160"></div>
                    </div>
                    <div class="ratio-info">비율 <div style="width:4px;height:4px;background:#ccc;border-radius:50%"></div> <span class="value" id="ratioValue">16:9</span></div>
                    <div class="preset-btn-row">
                        <button class="preset-btn" onclick="applySourcePreset(3840, 2160)">3840 X 2160</button>
                        <button class="preset-btn" onclick="applySourcePreset(1920, 1080)">1920 X 1080</button>
                        <button class="preset-btn" onclick="applySourcePreset(2944, 1920)">2944 X 1920</button>
                        <button class="preset-btn" onclick="applySourcePreset(2048, 1024)">2048 X 1024</button>
                    </div>
                </div>

                <hr class="dashed-divider">

                <div>
                    <div class="inner-title">Snap</div>
                    <div class="snap-grid" id="buttonGrid">
                        <button class="snap-btn" data-x="left" data-y="top">↖</button>
                        <button class="snap-btn" data-x="center" data-y="top">↑</button>
                        <button class="snap-btn" data-x="right" data-y="top">↗</button>
                        <button class="snap-btn" data-x="left" data-y="center">←</button>
                        <button class="snap-btn active" data-x="center" data-y="center">●</button>
                        <button class="snap-btn" data-x="right" data-y="center">→</button>
                        <button class="snap-btn" data-x="left" data-y="bottom">↙</button>
                        <button class="snap-btn" data-x="center" data-y="bottom">↓</button>
                        <button class="snap-btn" data-x="right" data-y="bottom">↘</button>
                    </div>
                </div>
            </div>

            <div class="col-right">
                <div class="scale-list" id="baseScaleResult"></div>

                <div class="control-box-blue">
                    <div class="form-row">
                        <div class="form-group"><label>Scale</label><input id="scaleValue" type="number" step="0.000001"></div>
                        <div class="form-group"><label>Scale height</label><input id="scaleHeight" type="number" step="0.000001" value="1.0"></div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Pos X</label>
                            <div class="readonly-box" onclick="copyValue(this.innerText, this)"><span id="posX_result">0.000000</span></div>
                        </div>
                        <div class="form-group">
                            <label>Pos Y</label>
                            <div class="readonly-box" onclick="copyValue(this.innerText, this)"><span id="posY_result">0.000000</span></div>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>중앙 Px (가로)</label>
                            <div class="stepper-wrapper">
                                <button type="button" tabindex="-1" onclick="adjustPixel('pixelX', -1)">−</button>
                                <input id="pixelX" type="number">
                                <button type="button" tabindex="-1" onclick="adjustPixel('pixelX', 1)">+</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>중앙 Py (세로)</label>
                            <div class="stepper-wrapper">
                                <button type="button" tabindex="-1" onclick="adjustPixel('pixelY', -1)">−</button>
                                <input id="pixelY" type="number">
                                <button type="button" tabindex="-1" onclick="adjustPixel('pixelY', 1)">+</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="helper-text">💡 클릭하여 복사</div>

                <div class="subdued-section">
                    <div class="inner-title">LED Wall 해상도</div>
                    <select id="ledPreset" style="margin-bottom: 12px;">
                        <option value="9216,3672" selected>남산 (9216 × 3672)</option>
                        <option value="7680,2160">8K 가로형 (7680 × 2160)</option>
                        <option value="3840,2160">4K UHD (3840 × 2160)</option>
                        <option value="">직접 입력</option>
                    </select>
                    <div class="form-row" style="margin-bottom: 0;">
                        <div class="form-group"><label>가로 (W)</label><input id="lw" type="number" disabled></div>
                        <div class="form-group"><label>세로 (H)</label><input id="lh" type="number" disabled></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const BASE_WIDTH = 11520;
    let currentSelectedLayer = 1; 

    const iwInput = document.getElementById("iw"), ihInput = document.getElementById("ih");
    const lwInput = document.getElementById("lw"), lhInput = document.getElementById("lh");
    const scaleInput = document.getElementById("scaleValue"), scaleHeightInput = document.getElementById("scaleHeight");
    const pixelXInput = document.getElementById("pixelX"), pixelYInput = document.getElementById("pixelY");
    const presetSelect = document.getElementById("ledPreset");
    const elSourceBox = document.getElementById("sourceBox"), elVisualizer = document.getElementById("visualizer");
    const sourceResLabel = document.getElementById("sourceResLabel");
    const layerList = document.getElementById("layerList");
    const previewLayerName = document.getElementById("previewLayerName");

    // --- [포토샵 스타일 세로 레이어 리스트 생성] ---
    const layerNames = {}; // 사용자가 지정한 이름을 저장할 객체

    for (let i = 1; i <= 20; i++) {
        layerNames[i] = `Layer ${i}`; // 초기 이름 셋팅
        
        const item = document.createElement("div");
        item.className = "layer-item" + (i === 1 ? " active" : "");
        item.id = `layer-item-${i}`;
        
        item.innerHTML = `
            <div class="layer-number">${i}</div>
            <div class="layer-name" id="layer-name-${i}">${layerNames[i]}</div>
        `;
        
        // 클릭 시 레이어 선택
        item.onclick = () => { selectLayer(i); };
        
        // 더블클릭 시 이름 변경 및 전송
        item.ondblclick = () => {
            const newName = prompt(`${i}번 레이어의 새 이름을 입력하세요:`, layerNames[i]);
            if (newName && newName.trim() !== "") {
                layerNames[i] = newName.trim();
                document.getElementById(`layer-name-${i}`).innerText = layerNames[i];
                if(currentSelectedLayer === i) previewLayerName.innerText = `[${layerNames[i]}]`;
                
                // 파이썬으로 이름 변경 명령어 쏘기!
                renameLayerInPicturall(i, layerNames[i]);
            }
        };
        
        layerList.appendChild(item);
    }

    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        const keyNum = parseInt(e.key);
        if (keyNum >= 1 && keyNum <= 9) { selectLayer(keyNum); } 
        else if (e.key === '0') { selectLayer(10); }
    });

    function selectLayer(num) {
        document.querySelectorAll(".layer-item").forEach(b => b.classList.remove("active"));
        const target = document.getElementById(`layer-item-${num}`);
        if(target) {
            target.classList.add("active");
            currentSelectedLayer = num;
            previewLayerName.innerText = `[${layerNames[num]}]`;
            triggerSend(); 
        }
    }

    let sendTimeout = null;
    function triggerSend() {
        if(sendTimeout) clearTimeout(sendTimeout);
        sendTimeout = setTimeout(sendToPicturall, 50); 
    }

    // 💡 이름 변경을 Picturall로 전송하는 독립 함수
    async function renameLayerInPicturall(layerNum, newName) {
        const bridgeIp = "127.0.0.1"; 
        try {
            await fetch(`http://${bridgeIp}:5000/snap`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    layer: layerNum,
                    name: newName // 이름 데이터 전송!
                })
            });
        } catch (error) {
            console.error("이름 전송 실패:", error);
        }
    }

    async function sendToPicturall() {
        const posX = document.getElementById("posX_result").innerText;
        const posY = document.getElementById("posY_result").innerText;
        const scaleVal = document.getElementById("scaleValue").value;
        const scaleHVal = document.getElementById("scaleHeight").value;
        const bridgeIp = "127.0.0.1"; 

        try {
            await fetch(`http://${bridgeIp}:5000/snap`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    layer: currentSelectedLayer,
                    x: posX,
                    y: posY,
                    scale: scaleVal,
                    scale_h: scaleHVal
                })
            });
        } catch (error) {
            console.error("전송 실패:", error);
        }
    }

    function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
    
    function applyPreset() {
        if (presetSelect.value) {
            const [w, h] = presetSelect.value.split(",");
            lwInput.value = w; lhInput.value = h;
            lwInput.disabled = true; lhInput.disabled = true;
        } else {
            lwInput.disabled = false; lhInput.disabled = false;
        }
        handleResolutionChange();
    }

    window.applySourcePreset = function(width, height) {
        iwInput.value = width; ihInput.value = height;
        handleResolutionChange();
    };

    window.adjustPixel = function(id, delta) {
        const input = document.getElementById(id);
        input.value = Number(input.value) + delta;
        document.querySelectorAll(".snap-btn").forEach(b => b.classList.remove("active"));
        updateAll();
    };

    window.copyValue = function(text, element) {
        navigator.clipboard.writeText(text);
        const target = element.querySelector('span') || element;
        const orig = target.innerText; 
        target.classList.add("copied"); target.innerText = "Copied";
        setTimeout(() => { target.classList.remove("copied"); target.innerText = orig; }, 800);
    };

    window.applyScale = function(val, element) {
        scaleInput.value = val; updateAll();
        const target = element.querySelector('.val');
        const orig = target.innerText; target.classList.add("copied"); target.innerText = "Copied";
        setTimeout(() => { target.classList.remove("copied"); target.innerText = orig; }, 800);
    };

    function handleResolutionChange() {
        const iw = Number(iwInput.value) || 1, ih = Number(ihInput.value) || 1;
        const lw = Number(lwInput.value) || 1, lh = Number(lhInput.value) || 1;
        const g = gcd(iw, ih); document.getElementById("ratioValue").innerText = `${iw/g}:${ih/g}`;
        
        const sW = (lw / BASE_WIDTH).toFixed(6);
        const sH = (Number(sW) * lh / (lw * ih / iw)).toFixed(6);
        const sO = (iw / BASE_WIDTH).toFixed(6);

        document.getElementById("baseScaleResult").innerHTML = `
            <div class="scale-item" onclick="applyScale('${sW}', this)"><span class="scale-label">가로 채우기</span><span class="val">${sW}</span></div>
            <div class="scale-item" onclick="applyScale('${sH}', this)"><span class="scale-label">세로 채우기</span><span class="val">${sH}</span></div>
            <div class="scale-item" onclick="applyScale('${sO}', this)"><span class="scale-label">정사이즈 (1:1)</span><span class="val">${sO}</span></div>`;

        elVisualizer.style.aspectRatio = `${lw}/${lh}`;
        sourceResLabel.innerText = `${iw}x${ih}`;
        
        if (!scaleInput.value) {
            scaleInput.value = sO;
            pixelXInput.value = Math.round(lw / 2);
            pixelYInput.value = Math.round(lh / 2);
            document.querySelectorAll(".snap-btn").forEach(b => b.classList.remove("active"));
            document.querySelector('.snap-btn[data-x="center"][data-y="center"]').classList.add("active");
            updateAll();
        } else {
            const activeSnap = document.querySelector(".snap-btn.active");
            if (activeSnap) { activeSnap.click(); } else { updateAll(); }
        }
    }

    function updateAll() {
        const lw = Number(lwInput.value), lh = Number(lhInput.value), iw = Number(iwInput.value), ih = Number(ihInput.value);
        const px = Number(pixelXInput.value), py = Number(pixelYInput.value);
        const S = Number(scaleInput.value), Sh = Number(scaleHeightInput.value);

        const nX = (px - lw / 2) / BASE_WIDTH;
        const nY = (lh / 2 - py) / BASE_WIDTH;
        document.getElementById("posX_result").innerText = nX.toFixed(6);
        document.getElementById("posY_result").innerText = nY.toFixed(6);

        const bW = S * BASE_WIDTH, bH = S * Sh * BASE_WIDTH * (ih / iw);
        const wP = (bW / lw) * 100, hP = (bH / lh) * 100;
        
        elSourceBox.style.width = `${wP}%`; 
        elSourceBox.style.height = `${hP}%`;
        elSourceBox.style.left = `${(px/lw)*100 - wP/2}%`; 
        elSourceBox.style.top = `${(py/lh)*100 - hP/2}%`;
        sourceResLabel.innerText = `${iw} X ${ih}`;

        triggerSend();
    }

    document.querySelectorAll(".snap-btn").forEach(btn => btn.addEventListener("click", function() {
        document.querySelectorAll(".snap-btn").forEach(b => b.classList.remove("active"));
        this.classList.add("active");
        const S = Number(scaleInput.value), Sh = Number(scaleHeightInput.value);
        const bW = S * BASE_WIDTH, bH = S * Sh * BASE_WIDTH * (Number(ihInput.value)/Number(iwInput.value));
        const lw = Number(lwInput.value), lh = Number(lhInput.value);
        
        let tx = lw/2, ty = lh/2;
        if(this.dataset.x === 'left') tx = bW/2; else if(this.dataset.x === 'right') tx = lw - bW/2;
        if(this.dataset.y === 'top') ty = bH/2; else if(this.dataset.y === 'bottom') ty = lh - bH/2;
        
        pixelXInput.value = Math.round(tx); pixelYInput.value = Math.round(ty); 
        updateAll();
    }));

    let isDrag = false, dragStartX = 0, dragStartY = 0, initPixelX = 0, initPixelY = 0;

    elSourceBox.addEventListener("mousedown", (e) => { 
        isDrag = true; dragStartX = e.clientX; dragStartY = e.clientY;
        initPixelX = Number(pixelXInput.value); initPixelY = Number(pixelYInput.value);
        e.preventDefault(); 
    });
    
    window.addEventListener("mouseup", () => isDrag = false);
    window.addEventListener("mousemove", (e) => {
        if(!isDrag) return;
        const rect = elVisualizer.getBoundingClientRect();
        const lw = Number(lwInput.value) || 1, lh = Number(lhInput.value) || 1;
        const scaleX = lw / rect.width, scaleY = lh / rect.height;
        pixelXInput.value = Math.round(initPixelX + ((e.clientX - dragStartX) * scaleX));
        pixelYInput.value = Math.round(initPixelY + ((e.clientY - dragStartY) * scaleY));
        document.querySelectorAll(".snap-btn").forEach(b => b.classList.remove("active"));
        updateAll();
    });

    [iwInput, ihInput, scaleInput, scaleHeightInput, pixelXInput, pixelYInput].forEach(el => el.addEventListener("input", updateAll));
    presetSelect.addEventListener("change", applyPreset);
    applyPreset();
</script>
</body>
</html>
